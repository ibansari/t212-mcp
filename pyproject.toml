[project]
name = "t212-mcp"
version = "0.1.0"
description = "Read-only FastMCP server for a Trading 212 portfolio"
readme = "README.md"
authors = [
    { name = "IbraheemAnsari", email = "ibraheem.ansari39@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.0",
    "fastmcp>=4.0.11",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.13",
    "langgraph-checkpoint-postgres>=3.1.2",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "playwright>=1.63.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "workos>=10.5.0",
    "xlrd>=2.0.2",
]

[project.scripts]
t212-mcp = "t212_mcp.server:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]  # so tests can import evals/
